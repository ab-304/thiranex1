<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Strength Analyzer</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>🔐 Password Strength Analyzer</h1>

        <p class="subtitle">
            Analyze your password security in real-time
        </p>

        <div class="input-box">

            <input type="password"
                   id="password"
                   placeholder="Enter your password"
                   onkeyup="checkPassword()">

            <span class="toggle" onclick="togglePassword()">
                👁
            </span>

        </div>


        <div class="strength-box">

            <div id="strengthBar"></div>

        </div>

        <h2 id="strengthText">Strength: </h2>

        <ul class="requirements">

            <li id="length">❌ At least 8 characters</li>

            <li id="uppercase">❌ Uppercase letter</li>

            <li id="lowercase">❌ Lowercase letter</li>

            <li id="number">❌ Number</li>

            <li id="special">❌ Special character</li>

        </ul>

        <div class="suggestion-box">

            <h3>💡 Strong Password Suggestion</h3>

            <p id="suggestion">
                Try adding symbols, numbers, and uppercase letters.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
